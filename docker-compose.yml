networks:
  job_portal_net:
    driver: bridge

x-matching-base: &matching-base
  build: ./Matching
  env_file:
    - .env
  volumes:
    - ./Matching:/app
    - ./utils:/app/utils
    - sentence_transformers_cache:/root/.cache/torch/sentence_transformers
  networks:
    - job_portal_net

services:
  user-service:
    build: ./User
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8001"
    volumes:
      - ./User:/app
      - ./utils:/app/utils
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_NAME: ${USER_DB_NAME}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: ${POSTGRES_HOST}
      DATABASE_PORT: ${POSTGRES_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - job_portal_net
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/admin/login/')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  job-service:
    build: ./Job
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./Job:/app
      - ./utils:/app/utils
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_NAME: ${JOB_DB_NAME}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: ${POSTGRES_HOST}
      DATABASE_PORT: ${POSTGRES_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - job_portal_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  application-service:
    build: ./Application
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8002"
    volumes:
      - ./Application:/app
      - ./utils:/app/utils
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_NAME: ${APPLICATION_DB_NAME}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: ${POSTGRES_HOST}
      DATABASE_PORT: ${POSTGRES_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - job_portal_net
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/admin/login/')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  matching-service:
    <<: *matching-base
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py setup_vector_search && python manage.py runserver 0.0.0.0:8003"
    restart: always
    environment:
      DATABASE_NAME: ${MATCHING_DB_NAME}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: ${POSTGRES_HOST}
      DATABASE_PORT: ${POSTGRES_PORT}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME}
      MONGODB_JOB_COLLECTION: ${MONGODB_JOB_COLLECTION}
      MONGODB_CV_COLLECTION: ${MONGODB_CV_COLLECTION}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy  
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/admin/login/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
  
  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - job_portal_net

  celery:
    <<: *matching-base
    container_name: celery_worker
    command: celery -A config worker --loglevel=info
    restart: always
    environment:
      DATABASE_NAME: ${MATCHING_DB_NAME}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: ${POSTGRES_HOST}
      DATABASE_PORT: ${POSTGRES_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  job-celery:
    build: ./Job
    container_name: job_celery_worker
    command: celery -A config worker --loglevel=info -Q job_service
    restart: always
    env_file:
      - .env
    volumes:
      - ./Job:/app
      - ./utils:/app/utils
    environment:
      DATABASE_NAME: ${JOB_DB_NAME}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: ${POSTGRES_HOST}
      DATABASE_PORT: ${POSTGRES_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - job_portal_net

  celery-beat:
    <<: *matching-base
    container_name: celery_beat
    command: celery -A config beat --loglevel=info
    restart: always
    environment:
      DATABASE_NAME: ${MATCHING_DB_NAME}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: ${POSTGRES_HOST}
      DATABASE_PORT: ${POSTGRES_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
  
  nginx:
    image: nginx:alpine
    container_name: nginx_gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    ports:
      - "80:80"
    depends_on:
      user-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      matching-service:
        condition: service_healthy
    networks:
      - job_portal_net
  postgres:
    image: postgres:17
    container_name: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - job_portal_net
  
  mongodb:
    image: mongodb/mongodb-atlas-local:preview
    container_name: mongodb
    hostname: mongodb
    ports:
    - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - mongodb_mongot:/data/mongot
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 90s
      timeout: 5s
      retries: 10

    networks:
      - job_portal_net

volumes:
  sentence_transformers_cache:
  postgres_data:
  mongodb_data:
  mongodb_config:
  mongodb_mongot: