version: "3.9"

networks:
  job_portal_net:
    driver: bridge

x-matching-base: &matching-base
  build: ./Matching
  env_file:
    - .env
  volumes:
    - ./Matching:/app
    - ./utils:/app/utils
  networks:
    - job_portal_net

services:
  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - job_portal_net

  user-service:
    build: ./User
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8001"
    volumes:
      - ./User:/app
      - ./utils:/app/utils
    ports:
      - "8001:8001"
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - job_portal_net

  job-service:
    build: ./Job
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./Job:/app
      - ./utils:/app/utils
    ports:
      - "8000:8000"
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - job_portal_net

  application-service:
    build: ./Application
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8002"
    volumes:
      - ./Application:/app
      - ./utils:/app/utils
    ports:
      - "8002:8002"
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - job_portal_net

  matching-service:
    <<: *matching-base
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8003"
    ports:
      - "8003:8003"
    restart: always
    depends_on:
      - redis

  celery:
    <<: *matching-base
    container_name: celery_worker
    command: celery -A config worker --loglevel=info
    restart: always
    depends_on:
      - redis

  celery-beat:
    <<: *matching-base
    container_name: celery_beat
    command: celery -A config beat --loglevel=info
    restart: always
    depends_on:
      - redis