worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 6M;   # slightly above the 5MB CV cap so nginx doesn't reject before Django's validator runs

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    upstream user_service {
        server user-service:8001;
    }

    upstream job_service {
        server job-service:8000;
    }

    upstream application_service {
        server application-service:8002;
    }

    # matching_service has no public routes — internal-only, called service-to-service.
    # No upstream block needed since nginx never proxies to it.

    server {
        listen 80;
        server_name _;

        # Block all internal service-to-service routes from external access
        location /api/v1/register/ {
    proxy_pass http://user_service;
    include proxy_params.conf;
}

    location /api/v1/login/ {
        proxy_pass http://user_service;
        include proxy_params.conf;
    }

    location /api/v1/profiles/ {
        proxy_pass http://user_service;
        include proxy_params.conf;
    }

    location /api/v1/token/ {
        proxy_pass http://user_service;
        include proxy_params.conf;
    }

    location /api/v1/jobs/ {
        proxy_pass http://job_service;
        include proxy_params.conf;
    }

    location /api/v1/admin/ {
        proxy_pass http://job_service;
        include proxy_params.conf;
    }

    location /api/v1/applications/ {
        proxy_pass http://application_service;
        include proxy_params.conf;
    }

    location /api/v1/cvs/ {
        proxy_pass http://application_service;
        include proxy_params.conf;
}

        location / {
            return 404;
        }
    }
}